name: Draft theme release

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching manifest.json
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: theme-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      - name: Verify release version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          versions = json.loads(Path('versions.json').read_text())
          assert os.environ['RELEASE_TAG'] == manifest['version'], 'Tag must match manifest version'
          assert versions[manifest['version']] == manifest['minAppVersion'], 'Update versions.json'
          PY
      - name: Ensure required release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for file in manifest.json theme.css; do
              if printf '%s\n' "$existing_assets" | grep -Fxq "$file"; then
                echo "Checking existing asset: $file"
              else
                gh release upload "$RELEASE_TAG" "$file"
              fi
            done
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "Lumen Docs $RELEASE_TAG" \
              --notes-file CHANGELOG.md \
              manifest.json theme.css
          fi
      - name: Verify uploaded install files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern manifest.json \
            --pattern theme.css \
            --dir "$RUNNER_TEMP/theme-install-files" \
            --clobber
          cmp manifest.json "$RUNNER_TEMP/theme-install-files/manifest.json"
          cmp theme.css "$RUNNER_TEMP/theme-install-files/theme.css"
